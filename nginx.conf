server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend container, reached by its Docker Compose service name.
    # Proxying it under the same origin as the frontend means the browser
    # never needs to know the backend's address, there's no CORS to worry
    # about, and Google's "Authorized JavaScript origins" only ever needs
    # this frontend's own URL.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend:4000/healthz;
    }

    # Long-cache hashed build assets (Angular's production build fingerprints
    # these filenames, so a new deploy naturally gets a new URL).
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Angular client-side routing — anything not a real file falls back to
    # index.html so refreshing a deep link (e.g. /dashboard) still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
