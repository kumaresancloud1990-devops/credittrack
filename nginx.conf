server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth response headers. `always` makes nginx add these even
    # on error responses (4xx/5xx), not just 200s.
    #
    # CSP is scoped to what this app actually loads: Google Identity
    # Services' script (Google sign-in), Google Fonts, and Google's own
    # Drive/OAuth endpoints (fetch() calls from google-drive.service.ts).
    # 'unsafe-inline' is kept for style-src because Angular/PrimeNG inject
    # inline <style> tags as part of normal component styling — locking
    # that down further would need a nonce-based setup that's its own,
    # separate change. No Strict-Transport-Security header here on purpose:
    # this is served over plain HTTP on a home LAN (http://localhost:8080),
    # and HSTS tells the browser to *refuse* future HTTP connections to this
    # host — adding it before this is ever served over HTTPS would lock you
    # out of your own app, not protect it. Add it later if this is ever put
    # behind real TLS.
    # img-src/frame-src both include blob: — document-upload.component.ts
    # previews an uploaded file via a blob: object URL before it's saved,
    # and without blob: in the policy the browser silently blocks that
    # preview (image or inline PDF) even though the upload itself succeeds.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The backend container, reached by its Docker Compose service name.
    # Proxying it under the same origin as the frontend means the browser
    # never needs to know the backend's address, there's no CORS to worry
    # about, and Google's "Authorized JavaScript origins" only ever needs
    # this frontend's own URL.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend:4000/healthz;
    }

    # Long-cache hashed build assets (Angular's production build fingerprints
    # these filenames, so a new deploy naturally gets a new URL).
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Angular client-side routing — anything not a real file falls back to
    # index.html so refreshing a deep link (e.g. /dashboard) still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
