@if (!auth.username() || !auth.password()) {
  <app-unlock></app-unlock>
} @else if (!data.ready()) {
  <div class="connecting-shell">
    <div class="card connecting-card">
      @if (data.syncError()) {
        <h2>Can't connect to the backend</h2>
        <p class="page-sub">{{ data.syncError() }}</p>
        <button class="btn primary" (click)="auth.signOut()">Sign out</button>
      } @else {
        <h2>Loading…</h2>
        <p class="page-sub">Connecting to the backend server.</p>
      }
    </div>
  </div>
} @else {
  <div class="shell">
    <app-sidebar></app-sidebar>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
}
